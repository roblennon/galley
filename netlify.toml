[build]
  command = "pnpm --filter @galley/web... build"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Documents stay on the device; this makes that promise mechanical.
    # 'unsafe-inline' for styles only: CodeMirror injects <style> elements at runtime.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
